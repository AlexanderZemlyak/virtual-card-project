services:

  postgres-card:

    image: postgres:15

    container_name: postgres-card

    environment:

      POSTGRES_DB: card_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:

      - "5432:5432"

    volumes:

      - postgres-card-data:/var/lib/postgresql/data

    networks:

      - card-network

  postgres-user:

    image: postgres:15

    container_name: postgres-user

    environment:

      POSTGRES_DB: user_service_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password

    ports:

      - "5433:5432"

    volumes:

      - postgres-user-data:/var/lib/postgresql/data

    networks:

      - card-network

  kafka:

    image: apache/kafka:3.9.0

    container_name: kafka

    ports:

      - "9092:9092"

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    networks:

      - card-network


  card-service:

    build:

      context: ./card-service

    container_name: card-service

    ports:

      - "8080:8080"

    environment:

      DB_URL: jdbc:postgresql://postgres-card:5432/card_service_db

      DB_USERNAME: postgres

      DB_PASSWORD: password

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

      USER_SERVICE_URL: http://user-service:8080

    depends_on:

      - postgres-card
      - user-service
      - kafka

    networks:

      - card-network

  user-service:

    build:

      context: ./user-service

    container_name: user-service

    ports:

      - "8081:8080"

    environment:

      DB_URL: jdbc:postgresql://postgres-user:5432/user_service_db

      DB_USERNAME: postgres

      DB_PASSWORD: password

      SERVER_PORT: 8080

    depends_on:

      - postgres-user

    networks:

      - card-network

  notification-service:

    build:

      context: ./notification-service

    container_name: notification-service

    environment:

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:

      - kafka

    networks:

      - card-network

  pdf-document-service:

    build:

      context: ./pdf-document-service

    container_name: pdf-document-service

    environment:

      KAFKA_BOOTSTRAP_SERVERS: kafka:9092

    depends_on:

      - kafka

    networks:

      - card-network

volumes:

  postgres-card-data:
  postgres-user-data:


networks:

  card-network: